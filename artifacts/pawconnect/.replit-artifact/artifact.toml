kind = "web"
previewPath = "/"
title = "PawConnect"
description = "An AI-powered all-in-one animal welfare platform for emergency rescue, adoption, vet care, lost-and-found reports, animal records, and community support."
version = "1.0.0"
id = "artifacts/pawconnect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19629

[services.development]
run = "pnpm --filter @workspace/pawconnect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pawconnect", "run", "build" ]
serve = "static"
publicDir = "artifacts/pawconnect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19629"
BASE_PATH = "/"
